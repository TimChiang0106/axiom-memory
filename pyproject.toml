[project]
name = "axiom"
version = "0.1.0"
description = "Personal cross-app memory as an MCP server. One brain for ChatGPT, Claude, Gemini CLI, and every agent you use."
readme = "README.md"
authors = [
    { name = "TimChiang0106", email = "timchiang0106@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "fastmcp>=3.4.2",
    "pydantic-settings>=2.14.2",
    "pyjwt[crypto]>=2.13.0",
]

[project.scripts]
axiom = "axiom.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.20",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# User-facing Traditional Chinese copy uses full-width punctuation on purpose.
"src/axiom/web/*.py" = ["RUF001"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
